<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

    function Calculate(){
        let n1 = document.getElementById("num1");
        let n2 = document.getElementById("num2");
        let output = document.getElementById("output");

        let v1 = n1.value.trim();
        let v2 = n2.value.trim();

        let error = false;

        n1.style.backgroundColor = "white";
        n2.style.backgroundColor = "white";

        if(v1 === ""){
            n1.style.backgroundColor = "red";
            error = true;
        }

        if(v2 === ""){
            n2.style.backgroundColor = "red";
            error = true;
        }

        if(v1 !== "" && isNaN(v1)){
            n1.style.backgroundColor = "yellow";
            error = true;
        }

        if(v2 !== "" && isNaN(v2)){
            n2.style.backgroundColor = "yellow";
            error = true;
        }

        if(error == true){
            output.value = "Error";
            output.style.backgroundColor = "orange";
        }else{
            output.value = Number(v1) + Number(v2);
            output.style.backgroundColor = "white";
        }
            
    }
    </script>
</head>
<body>
    <input type="text" id="num1" onblur="Calculate()"> +
    <input type="text" id="num2" onblur="Calculate()">
    <input type="button" value="=" onclick="Calculate()">
    <input type="text" id="output" readonly>


</body>
</html>
