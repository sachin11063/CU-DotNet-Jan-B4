<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb Switch</title>
    <script>    
        function turnOn()
        {
            document.getElementById("bulb").src = "bulb_on.jpeg";
        }

        function turnOff()
        {
            document.getElementById("bulb").src = "bulb_off.jpeg";
        }
    </script>

</head>
<body style="text-align: center;">
    
    <h3>Bulb Switch</h3>
    <img id="bulb" src="bulb_off.jpeg" width="150">
    <br>
    <button onclick="turnOn()">Turn On</button> 
    <button onclick="turnOff()">Turn Off</button>

</body>
</html>
